# Relaxed but real. The goal is catching structural mistakes in detection and
# workflow configuration, not enforcing house style on whitespace.
extends: relaxed

rules:
  line-length: disable
  comments: disable
  comments-indentation: disable
  document-start: disable
  truthy:
    level: warning
  indentation:
    spaces: consistent
    indent-sequences: whatever
  trailing-spaces: disable
  empty-lines: disable
  new-line-at-end-of-file:
    level: warning
