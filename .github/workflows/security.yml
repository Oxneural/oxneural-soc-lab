name: Security

# Secret scanning and push protection are already enabled on this repository
# at the GitHub level. This workflow adds history scanning, which those do not
# do, and a dependency review gate on pull requests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  credential-pattern-check:
    name: AWS credential pattern check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject AWS key patterns and .env files
        run: |
          set -uo pipefail
          fail=0
          if git ls-files | grep -E '(^|/)\.env($|\.)' ; then
            echo "::error::a .env file is tracked in this repository"; fail=1
          fi
          # AKIA / ASIA access key IDs. AWS publishes two placeholder key IDs in
          # its own documentation; the secrets-management doc quotes one to show
          # what a real key looks like. Those two are excluded by exact match so
          # the check stays strict without failing on documentation.
          if git grep -nE '\b(AKIA|ASIA)[0-9A-Z]{16}\b' -- . \
             | grep -vE 'AKIAIOSFODNN7EXAMPLE|AKIAI44QH8DHBEXAMPLE' ; then
            echo "::error::an AWS access key ID pattern is present"; fail=1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ; then
            echo "::error::a private key block is present"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "No AWS credential patterns, private keys or .env files found."
          exit $fail
